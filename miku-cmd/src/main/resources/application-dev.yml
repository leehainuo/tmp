spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://localhost:3306/miku?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
      username: root
      password:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      
  # Redis配置
  data:
    redis:
      enabled: false # 是否启用 Redis - 不启用则走本地缓存 Caffeine
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms
      # 限流功能配置
      rate-limit:
        enabled: true                    # 是否启用限流功能（默认：true）
        implementation: redis-template   # 实现方式：redis-template 或 redisson（默认：redis-template）
      # 防重复提交功能配置
      repeat-submit:
        enabled: true                    # 是否启用防重复提交功能（默认：true）
        implementation: redis-template   # 实现方式：redis-template 或 redisson（默认：redis-template）
      # Redisson 配置（可选）
      redisson:
        enabled: false                   # 是否启用 Redisson（默认：false）

# MyBatis-Plus配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.no.miku.*.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: del_flag
      logic-delete-value: 1
      logic-not-delete-value: 0
    banner: false

# 日志配置
logging:
  level:
    com.no.miku: debug
    org.springframework.security: debug

# Starter配置
miku:
  file:
    type: local # 或 oss/minio
    local:
      path: ./file
      enableDirectAccess: true
      tempRetentionHours: 24
      enableTempCleanup: false
